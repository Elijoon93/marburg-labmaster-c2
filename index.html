<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LabMaster C2"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><title>Marburg LabMaster C2 Academic</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#091827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}main{width:min(88vw,480px);text-align:center}.logo{width:82px;height:82px;margin:auto;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#13a28f,#2b6eb9);font-size:36px;font-weight:800;box-shadow:0 18px 50px #0005}h1{font-size:22px;margin:18px 0 7px}p{color:#bfd0df}.bar{height:8px;background:#ffffff18;border-radius:99px;overflow:hidden;margin-top:22px}.bar i{display:block;height:100%;width:35%;background:#20bfa7;border-radius:inherit;animation:load 1.1s infinite ease-in-out}@keyframes load{0%{transform:translateX(210%)}100%{transform:translateX(-310%)}}#error{display:none;background:#fff;color:#7d1725;padding:16px;border-radius:14px;text-align:right}</style></head><body><main id="loading"><div class="logo">C2</div><h1>Marburg LabMaster C2</h1><p>در حال بارگذاری محیط دانشگاهی آزمایشگاه…</p><div class="bar"><i></i></div></main><main id="error"></main><script>const PARTS=["./payload/app.001.b64", "./payload/app.002.b64", "./payload/app.003.b64", "./payload/app.004.b64", "./payload/app.005.b64", "./payload/app.006.b64", "./payload/app.007.b64", "./payload/app.008.b64", "./payload/app.009.b64", "./payload/app.010.b64", "./payload/app.011.b64", "./payload/app.012.b64", "./payload/app.013.b64", "./payload/app.014.b64"];(async()=>{try{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});const rs=await Promise.all(PARTS.map(p=>fetch(p,{cache:'force-cache'})));if(rs.some(r=>!r.ok))throw new Error('یکی از اجزای برنامه دریافت نشد.');const b64=(await Promise.all(rs.map(r=>r.text()))).join('');const raw=atob(b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('مرورگر برای بازکردن بسته برنامه باید به‌روز شود.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(err){document.getElementById('loading').style.display='none';const box=document.getElementById('error');box.style.display='block';box.innerHTML='<b>بارگذاری برنامه کامل نشد.</b><br><br>'+String(err.message||err)+'<br><br>صفحه را با اتصال اینترنت یک‌بار تازه‌سازی کنید.';}})();</script></body></html>
